<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGyan 3D Animation Learning Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }
        header h1 { margin: 0; font-size: 1.4rem; font-weight: 700; }
        header p { margin: 5px 0 0; opacity: 0.9; font-size: 0.85rem; }
        
        main {
            flex: 1;
            max-width: 700px;
            width: 100%;
            margin: 20px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        .subject-hero {
            background: white;
            padding: 15px 20px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .subject-hero h2 { margin: 0; color: var(--primary-dark); font-size: 1.15rem; }
        .badge { background: #e0e7ff; color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

        .video-list { display: flex; flex-direction: column; gap: 20px; }
        .video-card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid #f1f5f9;
        }
        .video-title-bar {
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            border-bottom: 1px solid #f1f5f9;
            background: #ffffff;
        }
        .video-wrapper {
            position: relative;
            background: #000;
            width: 100%;
            aspect-ratio: 16/9;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Access Denied / Restricted View */
        .restricted-box {
            background: white;
            padding: 35px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-top: 40px;
        }
        .restricted-box h2 { color: #dc2626; margin-top: 0; }
        .restricted-box p { color: var(--text-light); font-size: 0.9rem; }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.75rem;
            color: var(--text-light);
            background: white;
            border-top: 1px solid #f1f5f9;
            margin-top: auto;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>EduGyan 3D Animation Portal</h1>
        <p>Secure Textbook Learning Experience</p>
    </header>

    <main>
        <!-- SUBJECT SPECIFIC VIEW (Loaded via QR Scan) -->
        <div id="subject-view" class="hidden">
            <div class="subject-hero">
                <div>
                    <span class="badge" id="classBadge">Class X</span>
                    <h2 id="subjectTitle">Subject</h2>
                </div>
            </div>
            <div class="video-list" id="videoList"></div>
        </div>

        <!-- RESTRICTED HOME VIEW (Blocks manual browsing) -->
        <div id="restricted-view" class="hidden">
            <div class="restricted-box">
                <h2>🔒 Access Restricted</h2>
                <p>This portal is protected. Please scan the QR code printed inside your EduGyan textbook to access subject videos.</p>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 EduGyan Publications. All Rights Reserved. Secure Streaming.
    </footer>

    <script>
        // Map your classes, subjects, and secure video iframe codes here:
        const database = {
            "1": {
                "maths": { class: "Class 1", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Counting Numbers", embed: '<iframe src="https://iframe.mediadelivery.net/embed/YOUR_LIBRARY_ID/YOUR_VIDEO_ID" loading="lazy" allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;" allowfullscreen="true"></iframe>' }] },
                "english": { class: "Class 1", name: "English 3D Animations", videos: [{ title: "Chapter 1: Alphabet Sounds", file: "videos/class1-maths-ch1.mp4" }] },
                "evs": { class: "Class 1", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Parts of Body", embed: '<iframe src="https://iframe.mediadelivery.net/embed/..." ...></iframe>' }] }
            },
            "2": {
                "maths": { class: "Class 2", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Shapes", embed: '<iframe src="..." ...></iframe>' }] },
                "english": { class: "Class 2", name: "English 3D Animations", videos: [{ title: "Chapter 2: Action Words", embed: '<iframe src="..." ...></iframe>' }] },
                "evs": { class: "Class 2", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Plants", embed: '<iframe src="..." ...></iframe>' }] }
            },
            "3": {
                "maths": { class: "Class 3", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Tables", embed: '<iframe src="..." ...></iframe>' }] },
                "english": { class: "Class 3", name: "English 3D Animations", videos: [{ title: "Chapter 1: Nouns", embed: '<iframe src="..." ...></iframe>' }] },
                "evs": { class: "Class 3", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Water", embed: '<iframe src="..." ...></iframe>' }] }
            },
            "4": {
                "maths": { class: "Class 4", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Fractions", embed: '<iframe src="..." ...></iframe>' }] },
                "english": { class: "Class 4", name: "English 3D Animations", videos: [{ title: "Chapter 1: Tenses", embed: '<iframe src="..." ...></iframe>' }] },
                "evs": { class: "Class 4", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Animals", embed: '<iframe src="..." ...></iframe>' }] }
            },
            "5": {
                "maths": { class: "Class 5", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Area & Volume", embed: '<iframe src="..." ...></iframe>' }] },
                "english": { class: "Class 5", name: "English 5 Animations", videos: [{ title: "Chapter 1: Composition", embed: '<iframe src="..." ...></iframe>' }] },
                "evs": { class: "Class 5", name: "EVS 5 Animations", videos: [{ title: "Chapter 1: Ecosystems", embed: '<iframe src="..." ...></iframe>' }] }
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const cls = urlParams.get('class');
        const subj = urlParams.get('subject');

        if (cls && subj && database[cls] && database[cls][subj]) {
            document.getElementById('subject-view').classList.remove('hidden');
            const data = database[cls][subj];
            
            document.getElementById('classBadge').innerText = data.class;
            document.getElementById('subjectTitle').innerText = data.name;

            const videoListContainer = document.getElementById('videoList');
            videoListContainer.innerHTML = '';

            data.videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-title-bar">${v.title}</div>
                    <div class="video-wrapper">${v.embed}</div>
                `;
                videoListContainer.appendChild(card);
            });
        } else {
            // Show restriction screen if parameters are missing or incorrect
            document.getElementById('restricted-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
