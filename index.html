<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGyan | Premium 3D Learning Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-card: #1f293d;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Cinematic Header */
        header {
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.95) 0%, rgba(9, 13, 22, 0.8) 100%);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 4px 20px var(--primary-glow);
        }
        .brand-text h1 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
        .brand-text p { margin: 2px 0 0; font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

        /* Main Container */
        main {
            flex: 1;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }

        /* Subject Banner Hero */
        .subject-hero {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(56, 189, 248, 0.05));
            border: 1px solid rgba(99, 102, 241, 0.2);
            padding: 24px;
            border-radius: var(--radius-lg);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .hero-info h2 { margin: 6px 0 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
        .badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* Video Stream Feed */
        .video-feed {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }
        .video-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .video-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }
        .video-meta {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.01);
        }
        .video-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .video-title span {
            color: var(--primary);
            font-size: 1.2rem;
        }
        .chapter-pill {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .video-player-container {
            position: relative;
            background: #000;
            width: 100%;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* Security Restricted Screen */
        .restricted-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
        }
        .restricted-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            padding: 40px 30px;
            border-radius: var(--radius-lg);
            text-align: center;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .restricted-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        .restricted-card h2 { margin: 0 0 10px; font-size: 1.35rem; color: #f87171; }
        .restricted-card p { margin: 0; color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }

        /* Footer */
        footer {
            text-align: center;
            padding: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: var(--bg-surface);
            margin-top: auto;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <div class="brand-logo">EG</div>
            <div class="brand-text">
                <h1>EduGyan</h1>
                <p>Interactive 3D Stream</p>
            </div>
        </div>
    </header>

    <main>
        <!-- SUBJECT FEED VIEW (Loaded via Textbook QR Scan) -->
        <div id="subject-view" class="hidden">
            <div class="subject-hero">
                <div class="hero-info">
                    <span class="badge" id="classBadge">Class X</span>
                    <h2 id="subjectTitle">Subject Title</h2>
                </div>
            </div>
            <div class="video-feed" id="videoList"></div>
        </div>

        <!-- ACCESS RESTRICTED SCREEN -->
        <div id="restricted-view" class="hidden restricted-wrapper">
            <div class="restricted-card">
                <div class="restricted-icon">🔒</div>
                <h2>Secure Access Required</h2>
                <p>This learning portal is protected. Please scan the QR code printed inside your official EduGyan textbook to stream chapters.</p>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 EduGyan Publications. All Rights Reserved. Encrypted Secure Stream.
    </footer>

    <script>
        // Database mapped to your direct GitHub video files inside the 'videos/' folder
        const database = {
            "1": {
                "maths": { 
                    class: "Class 1", 
                    name: "Mathematics 3D Animations", 
                    videos: [
                        { title: "Chapter 1: Counting Numbers", file: "videos/class1-maths-ch1.mp4" }
                    ] 
                },
                "english": { 
                    class: "Class 1", 
                    name: "English 3D Animations", 
                    videos: [
                        { title: "Chapter 1: Alphabet Sounds & Phonics", file: "videos/class1-english-ch1.mp4" },
                        { title: "Chapter 2: Test", file: "videos/class1-english-ch1.mp4" },
                        { title: "Chapter 3: Test1", file: "videos/class1-english-ch1.mp4" }
                    ] 
                },
                "evs": { 
                    class: "Class 1", 
                    name: "EVS 3D Animations", 
                    videos: [
                        { title: "Chapter 1: Parts of Body", file: "videos/class1-evs-ch1.mp4" }
                    ] 
                }
            },
            "2": {
                "maths": { class: "Class 2", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Shapes", file: "videos/class2-maths-ch1.mp4" }] },
                "english": { class: "Class 2", name: "English 3D Animations", videos: [{ title: "Chapter 1: Action Words", file: "videos/class2-english-ch1.mp4" }] },
                "evs": { class: "Class 2", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Plants", file: "videos/class2-evs-ch1.mp4" }] }
            },
            "3": {
                "maths": { class: "Class 3", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Tables", file: "videos/class3-maths-ch1.mp4" }] },
                "english": { class: "Class 3", name: "English 3D Animations", videos: [{ title: "Chapter 1: Nouns", file: "videos/class3-english-ch1.mp4" }] },
                "evs": { class: "Class 3", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Water", file: "videos/class3-evs-ch1.mp4" }] }
            },
            "4": {
                "maths": { class: "Class 4", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Fractions", file: "videos/class4-maths-ch1.mp4" }] },
                "english": { class: "Class 4", name: "English 3D Animations", videos: [{ title: "Chapter 1: Tenses", file: "videos/class4-english-ch1.mp4" }] },
                "evs": { class: "Class 4", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Animals", file: "videos/class4-evs-ch1.mp4" }] }
            },
            "5": {
                "maths": { class: "Class 5", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Area & Volume", file: "videos/class5-maths-ch1.mp4" }] },
                "english": { class: "Class 5", name: "English 3D Animations", videos: [{ title: "Chapter 1: Composition", file: "videos/class5-english-ch1.mp4" }] },
                "evs": { class: "Class 5", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Ecosystems", file: "videos/class5-evs-ch1.mp4" }] }
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const cls = urlParams.get('class');
        const subj = urlParams.get('subject');

        if (cls && subj && database[cls] && database[cls][subj]) {
            document.getElementById('subject-view').classList.remove('hidden');
            const data = database[cls][subj];
            
            document.getElementById('classBadge').innerText = data.class;
            document.getElementById('subjectTitle').innerText = data.name;

            const videoListContainer = document.getElementById('videoList');
            videoListContainer.innerHTML = '';

            data.videos.forEach((v, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-meta">
                        <h3 class="video-title"><span>▶</span> ${v.title}</h3>
                        <span class="chapter-pill">Part 0${index + 1}</span>
                    </div>
                    <div class="video-player-container">
                        <video controls controlsList="nodownload" playsinline preload="metadata">
                            <source src="${v.file}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                `;
                videoListContainer.appendChild(card);
            });
        } else {
            document.getElementById('restricted-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
