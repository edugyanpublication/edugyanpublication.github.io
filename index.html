<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGyan 3D Animation Learning Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }
        header h1 { margin: 0; font-size: 1.6rem; font-weight: 700; }
        header p { margin: 8px 0 0; opacity: 0.9; font-size: 0.9rem; }
        
        main {
            flex: 1;
            max-width: 700px;
            width: 100%;
            margin: 25px auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* Subject View Header */
        .subject-hero {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .subject-hero h2 { margin: 0; color: var(--primary-dark); font-size: 1.25rem; }
        .badge { background: #e0e7ff; color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

        /* Video List Styling */
        .video-list { display: flex; flex-direction: column; gap: 20px; }
        .video-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            border: 1px solid #f1f5f9;
        }
        .video-title-bar {
            padding: 15px 20px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .video-title-bar span { font-size: 1.2rem; }
        
        .video-wrapper {
            position: relative;
            background: #000;
            width: 100%;
            aspect-ratio: 16/9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            outline: none;
        }

        /* Fallback Home view if someone opens root */
        .home-box {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .home-box h2 { color: var(--primary-dark); margin-top: 0; }
        .home-box p { color: var(--text-light); font-size: 0.9rem; }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: var(--text-light);
            background: white;
            border-top: 1px solid #f1f5f9;
            margin-top: auto;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <h1>EduGyan 3D Animation Portal</h1>
        <p>Interactive 3D Learning Experience (Classes 1 to 5)</p>
    </header>

    <main>
        <!-- SUBJECT SPECIFIC VIEW (Shown when QR Code is scanned) -->
        <div id="subject-view" class="hidden">
            <div class="subject-hero">
                <div>
                    <span class="badge" id="classBadge">Class X</span>
                    <h2 id="subjectTitle">Mathematics</h2>
                </div>
            </div>
            <div class="video-list" id="videoList">
                <!-- Videos injected dynamically -->
            </div>
        </div>

        <!-- DEFAULT HOME VIEW -->
        <div id="home-view" class="hidden">
            <div class="home-box">
                <h2>Welcome to EduGyan QR Learning</h2>
                <p>Please scan a QR code from your printed textbook to view subject-specific 3D animations.</p>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 EduGyan Publications. Secure Streaming.
    </footer>

    <script>
        // Database mapping each class & subject to local video files stored in your repository 'videos' folder
        const database = {
            "1": {
                "maths": { class: "Class 1", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: 3D Counting & Numbers", file: "videos/class1-maths-ch1.mp4" }] },
                "english": { class: "Class 1", name: "English 3D Animations", videos: [{ title: "Chapter 1: Phonics & Alphabet Adventure", file: "videos/class1-english-ch1.mp4" }] },
                "evs": { class: "Class 1", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Parts of the Body", file: "videos/class1-evs-ch1.mp4" }] }
            },
            "2": {
                "maths": { class: "Class 2", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: 2D & 3D Shapes", file: "videos/class2-maths-ch1.mp4" }] },
                "english": { class: "Class 2", name: "English 3D Animations", videos: [{ title: "Chapter 1: Action Words in Action", file: "videos/class2-english-ch1.mp4" }] },
                "evs": { class: "Class 2", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Plants & Trees", file: "videos/class2-evs-ch1.mp4" }] }
            },
            "3": {
                "maths": { class: "Class 3", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Multiplication Fun", file: "videos/class3-maths-ch1.mp4" }] },
                "english": { class: "Class 3", name: "English 3D Animations", videos: [{ title: "Chapter 1: Nouns & Pronouns", file: "videos/class3-english-ch1.mp4" }] },
                "evs": { class: "Class 3", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Our Water Sources", file: "videos/class3-evs-ch1.mp4" }] }
            },
            "4": {
                "maths": { class: "Class 4", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Fractions Explained", file: "videos/class4-maths-ch1.mp4" }] },
                "english": { class: "Class 4", name: "English 3D Animations", videos: [{ title: "Chapter 1: Storytelling Grammar", file: "videos/class4-english-ch1.mp4" }] },
                "evs": { class: "Class 4", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Animal Habitats", file: "videos/class4-evs-ch1.mp4" }] }
            },
            "5": {
                "maths": { class: "Class 5", name: "Mathematics 3D Animations", videos: [{ title: "Chapter 1: Area, Perimeter & Volume", file: "videos/class5-maths-ch1.mp4" }] },
                "english": { class: "Class 5", name: "English 3D Animations", videos: [{ title: "Chapter 1: Advanced Composition", file: "videos/class5-english-ch1.mp4" }] },
                "evs": { class: "Class 5", name: "EVS 3D Animations", videos: [{ title: "Chapter 1: Natural Ecosystems", file: "videos/class5-evs-ch1.mp4" }] }
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const cls = urlParams.get('class');
        const subj = urlParams.get('subject');

        if (cls && subj && database[cls] && database[cls][subj]) {
            document.getElementById('subject-view').classList.remove('hidden');
            const data = database[cls][subj];
            
            document.getElementById('classBadge').innerText = data.class;
            document.getElementById('subjectTitle').innerText = data.name;

            const videoListContainer = document.getElementById('videoList');
            videoListContainer.innerHTML = '';

            data.videos.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = `
                    <div class="video-title-bar"><span>🎬</span> ${v.title}</div>
                    <div class="video-wrapper">
                        <video controls controlsList="nodownload" playsinline>
                            <source src="${v.file}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    </div>
                `;
                videoListContainer.appendChild(card);
            });
        } else {
            document.getElementById('home-view').classList.remove('hidden');
        }
    </script>
</body>
</html>
